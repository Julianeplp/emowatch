<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Emotion‑Aware Interaction Aid for Autism Support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#eaf2ff;
      --ink:#0b132b;
      --accent:#6aa5ff;
      --accent-2:#4a7edc;
      --panel:#ffffff;
      --shadow:0 10px 30px rgba(0,0,0,.12);
      --radius:28px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; background:var(--bg); color:var(--ink);
      font-family:Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .poster{max-width:960px; margin:24px auto; padding:0 16px; display:flex; flex-direction:column; gap:20px;}

    .hero{
      position:relative; overflow:hidden; border-radius:var(--radius);
      background:linear-gradient(135deg, #6aa5ff 0%, #4a7edc 80%);
      color:#fff;
      box-shadow:var(--shadow);
      padding:50px 36px;
      text-align:center;
    }
    .hero h1{
      margin:0; font-weight:800; letter-spacing:-.02em;
      font-size:clamp(28px,5vw,56px);
      font-family:Space Grotesk, Inter, sans-serif;
    }
    .hero p{margin:12px auto 0; max-width:720px; opacity:.9; font-size:clamp(16px,2.2vw,20px);}

    .footer{
      border-radius:var(--radius);
      min-height:260px;
      background:var(--panel);
      box-shadow:var(--shadow);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background-image:linear-gradient(135deg, rgba(106,165,255,.10), rgba(74,126,220,.10));
    }

    /* Bottom brand frame */
    .brand-card{
      width:min(680px, 100%);
      border-radius:22px;
      padding:18px 18px;
      background:linear-gradient(135deg, rgba(106,165,255,.18), rgba(255,255,255,.85));
      border:1px solid rgba(74,126,220,.20);
      box-shadow:0 14px 28px rgba(11,19,43,.10);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
    }
    .brand-left{display:flex; align-items:center; gap:14px; min-width:0;}

    .eurecom-mark{
      height:44px;
      width:auto;
      display:block;
      background:#ffffff;
      padding:6px 10px;
      border-radius:8px;
      box-shadow:0 4px 10px rgba(0,0,0,.08);
    }

    .brand-divider{
      width:1px;
      height:42px;
      background:rgba(11,19,43,.18);
      flex:0 0 auto;
    }

    .brand-name{
      font-family:Space Grotesk, Inter, sans-serif;
      font-weight:800;
      letter-spacing:-.02em;
      font-size:clamp(22px, 3vw, 32px);
      line-height:1;
      color:var(--ink);
      white-space:nowrap;
    }

    .brand-sub{
      margin-top:6px;
      font-size:13px;
      opacity:.75;
      color:var(--ink);
      white-space:nowrap;
    }

    .brand-pill{
      background:rgba(11,19,43,.92);
      color:#fff;
      font-weight:700;
      font-size:12px;
      padding:10px 12px;
      border-radius:999px;
      box-shadow:0 10px 18px rgba(11,19,43,.18);
      white-space:nowrap;
    }

    @media (max-width:520px){
      .brand-card{flex-direction:column; align-items:flex-start;}
      .brand-pill{align-self:stretch; text-align:center;}
      .brand-divider{display:none;}
      .brand-name,.brand-sub{white-space:normal;}
    }

    .canvas{
      background:#0b132b; color:#fff; border-radius:22px; padding:20px 16px; box-shadow:var(--shadow);
      text-align:center;
    }
    .canvas h2{margin:0 0 8px; font-size:clamp(18px,2.6vw,24px)}
    .canvas p{margin:0 0 16px; opacity:.85}
    .cta-link{
      display:inline-block;
      background:#6aa5ff;
      color:#fff;
      text-decoration:none;
      font-weight:800;
      padding:10px 20px;
      border-radius:999px;
      box-shadow:0 6px 16px rgba(0,0,0,.15);
      transition:transform .2s ease, background .3s ease;
    }
    .cta-link:hover{transform:translateY(-2px); background:#4a7edc;}

    @media print{body{background:#fff} .hero,.canvas,.footer{box-shadow:none}}
  </style>
</head>
<body>
  <main class="poster" data-target="https://example.com/prototype-trial"> // Lien vidéo youtube
    <section class="hero">
      <h1>Emotion‑Aware Interaction Aid for Autism Support</h1>
      <p>Prototype Trial — Watch the full test run online</p>
    </section>

    <section class="canvas">
      <h2>Watch the prototype trial</h2>
      <p>Click the button below to open the video page :</p>
      <a id="videoLink" class="cta-link" href="#" target="_blank" rel="noopener">▶ Watch the Video</a>
    </section>

    <section class="footer" aria-label="brand">
      <div class="brand-card">
        <div class="brand-left">
          <img id="eurecomLogo" class="eurecom-mark" src="./assets/eurecom-logo.png" alt="EURECOM logo" loading="lazy">
          <div class="brand-divider" aria-hidden="true"></div>
          <div>
            <div class="brand-name">Emowatch</div>
            <div class="brand-sub">Student project showcase</div>
          </div>
        </div>
        <div class="brand-pill">EURECOM</div>
      </div>
    </section>
  </main>

  <script>
    const container = document.querySelector('.poster');
    const TARGET_URL = container?.dataset.target?.trim() || 'https://example.com/prototype-trial';
    const link = document.getElementById('videoLink');
    link.href = TARGET_URL;

    // Make the logo path robust on GitHub Pages sub-paths
    const logo = document.getElementById('eurecomLogo');
    if (logo) {
      logo.src = new URL('assets/eurecom-logo.png', document.baseURI).toString();
      logo.addEventListener('error', () => {
        // Fallback: show text if the image is missing or not committed
        const fallback = document.createElement('div');
        fallback.className = 'eurecom-mark';
        fallback.style.display = 'flex';
        fallback.style.alignItems = 'center';
        fallback.style.justifyContent = 'center';
        fallback.style.fontWeight = '800';
        fallback.style.color = '#0b132b';
        fallback.textContent = 'EURECOM';
        logo.replaceWith(fallback);
        console.warn('EURECOM logo not found. Make sure assets/eurecom-logo.png exists in your repo and is committed.');
      }, { once: true });
    }
  </script>
</body>
</html>
